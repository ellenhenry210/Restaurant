version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: snaporder_db
    environment:
      POSTGRES_DB: snaporder
      POSTGRES_USER: snaporder_user
      POSTGRES_PASSWORD: changeme_in_local_env
    ports:
      # Host port 5433, not 5432: a native Windows Postgres service is
      # already bound to 5432 on this machine, and localhost connections
      # were silently landing on that one instead of this container
      # (different credentials -> confusing auth failures). Container-
      # internal port stays 5432; only the host-side mapping changes, so
      # nothing inside the container/network needs updating, just DB_PORT
      # in .env / .env.example to match.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # -d snaporder is required here: without it, pg_isready defaults the
      # target database to the username (snaporder_user), which doesn't
      # exist, so every check logs a "FATAL: database ... does not exist"
      # even though the server itself is healthy and the check still
      # passes (pg_isready only needs a response, not a valid database).
      test: ["CMD-SHELL", "pg_isready -U snaporder_user -d snaporder"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: snaporder_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: snaporder_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"      # AMQP port
      - "15672:15672"    # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data: